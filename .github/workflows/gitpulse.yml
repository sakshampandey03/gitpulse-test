name: GitPulse PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Bob Shell
        run: |
          # Install Bob Shell CLI
          npm install -g @ibm/bob-shell
          
          # Verify installation
          bob --version
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
      
      - name: Install GitPulse Dependencies
        run: |
          cd gitpulse
          npm install
      
      - name: Run GitPulse Review
        run: |
          node gitpulse/src/index.js check --ci --output both
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}