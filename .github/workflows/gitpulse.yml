name: GitPulse PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Debug - Show changed files
        run: |
          echo "=== Changed files ==="
          git diff origin/main...HEAD --name-only
          echo "=== Current directory ==="
          pwd
          echo "=== Directory contents ==="
          ls -la
          echo "=== src/ contents ==="
          ls -la src/ || echo "No src/ directory"
          echo "=== .bob/ exists? ==="
          ls -la .bob/ || echo "No .bob/ directory"
      
      - name: Install GitPulse Dependencies
        run: |
          cd gitpulse
          npm install
      
      - name: Run GitPulse Review
        run: |
          node gitpulse/src/index.js check --ci --output both
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
